server {
 listen 80;
 server_name _;
 client_max_body_size 100m;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 200s; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
